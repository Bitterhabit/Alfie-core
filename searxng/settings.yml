# Private SearXNG configuration for Alfie.
# The container replaces this placeholder with SEARXNG_SECRET at startup.
use_default_settings: true

general:
  debug: false
  instance_name: "Alfie Search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  secret_key: "ultrasecretkey"
  bind_address: "0.0.0.0"
  limiter: false
  image_proxy: false
