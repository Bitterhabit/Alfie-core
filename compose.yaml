services:
  alfie-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: alfie-core:0.3.0
    container_name: alfie-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8780
      ALFIE_CORE_DATA_DIR: /data
    volumes:
      - alfie_core_data:/data
    expose:
      - "8780"
    networks:
      - alfie-core-internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8780/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  alfie-interface:
    build:
      context: .
      dockerfile: interface/Dockerfile
    image: alfie-interface:0.1.0
    container_name: alfie-interface
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8781
      ALFIE_UI_DATA_DIR: /data
      ALFIE_CORE_URL: http://alfie-core:8780
    volumes:
      - alfie_interface_data:/data
    expose:
      - "8781"
    networks:
      - alfie-core-internal
    depends_on:
      alfie-core:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8781/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

networks:
  alfie-core-internal:
    name: alfie-core-internal

volumes:
  alfie_core_data:
    name: alfie-core-data
  alfie_interface_data:
    name: alfie-interface-data
